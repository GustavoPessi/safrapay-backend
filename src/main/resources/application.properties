spring.application.name=safrapay-backend
server.port=8080

# Credenciais do banco vem de variaveis de ambiente (nunca commitar senha aqui)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
# validate: o Hibernate so confere se o schema bate com as entidades JPA e
# nunca altera o banco. Desde 28/09/2026 toda mudanca de schema passa por uma
# migration Flyway nova em src/main/resources/db/migration (V3__..., V4__...).
# Nunca editar uma migration ja aplicada - sempre criar a proxima versao.
spring.jpa.hibernate.ddl-auto=validate

# Flyway. O banco de producao (RDS) ja existia antes do Flyway: na primeira
# subida ele registra a V1 como baseline (sem executar) e roda so da V2 em
# diante. Num banco vazio (ex.: local/teste) roda a V1 normalmente.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline do schema criado pelo ddl-auto=update

# Segredo do JWT vem de variavel de ambiente (nunca commitar aqui).
# Gerar um valor longo e aleatorio, ex: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
# 24 horas em milissegundos
jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Amazon SES (e-mail de confirmacao de cadastro e redefinicao de senha) ---
# Credenciais da AWS (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) vem de
# variaveis de ambiente e sao lidas automaticamente pelo SDK - nao ficam aqui.
aws.ses.region=${AWS_SES_REGION:us-east-2}
# E-mail remetente: precisa estar verificado no console do SES.
aws.ses.remetente=${SES_REMETENTE}
# URL base publica do backend, usada para montar os links dos e-mails.
# Em producao vem do .env da EC2 (APP_BASE_URL=https://api.safra-pay.com, desde 28/09/2026).
app.base-url=${APP_BASE_URL:https://api.safra-pay.com}

# --- Assistente de IA (chat de lancamentos dentro do app, desde 01/10/2026) ---
# Chave da API da Anthropic (Claude): SO no .env da EC2 (ANTHROPIC_API_KEY),
# nunca commitar. Sem chave o endpoint /api/chat/mensagem responde 503 e o
# resto do backend funciona normalmente.
ia.anthropic.api-key=${ANTHROPIC_API_KEY:}
# Modelo usado na extracao dos lancamentos (trocavel sem mexer no codigo).
ia.modelo=${IA_MODELO:claude-haiku-4-5-20251001}
ia.max-tokens=${IA_MAX_TOKENS:1024}
# Limite de saida quando o produtor anexa um arquivo (muitos lancamentos de uma vez).
ia.max-tokens-arquivo=${IA_MAX_TOKENS_ARQUIVO:8192}
# Limite de mensagens por usuario por dia (protecao de custo).
ia.limite-diario=${IA_LIMITE_DIARIO:50}
