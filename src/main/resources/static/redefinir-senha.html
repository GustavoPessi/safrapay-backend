<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redefinir senha — SafraPay</title>
<style>
  :root {
    --primary: #2E7D32;
    --primary-dark: #245f27;
    --bg: #F4F7F2;
    --card: #FFFFFF;
    --text: #1B1B1B;
    --muted: #5C6B5D;
    --error: #B3261E;
    --border: #DDE4DA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .logo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
  }
  .logo-text {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 6px;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 16px;
    background: var(--bg);
    color: var(--text);
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--primary);
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg {
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.5;
    border-radius: 10px;
    padding: 12px 14px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.success { background: #E8F3E8; color: var(--primary-dark); }
  .msg.error { background: #FBEAE9; color: var(--error); }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin: -10px 0 16px;
  }
  .state-hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-dot"></span>
      <span class="logo-text">SafraPay</span>
    </div>

    <div id="formState">
      <h1>Criar nova senha</h1>
      <p class="subtitle">Escolha uma nova senha para sua conta.</p>

      <form id="resetForm">
        <label for="novaSenha">Nova senha</label>
        <input type="password" id="novaSenha" name="novaSenha" minlength="6" required autocomplete="new-password">
        <p class="hint">Mínimo de 6 caracteres.</p>

        <label for="confirmarSenha">Confirmar nova senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" minlength="6" required autocomplete="new-password">

        <button type="submit" id="btnSubmit">Redefinir senha</button>
      </form>

      <div id="msg" class="msg"></div>
    </div>

    <div id="noTokenState" class="state-hidden">
      <h1>Link inválido</h1>
      <p class="subtitle">Este link de redefinição de senha está incompleto ou inválido. Solicite um novo link pela tela "Esqueci minha senha" no app.</p>
    </div>
  </div>

  <script>
    function getToken() {
      var params = new URLSearchParams(window.location.search);
      return params.get('token');
    }

    var token = getToken();
    var formState = document.getElementById('formState');
    var noTokenState = document.getElementById('noTokenState');
    var form = document.getElementById('resetForm');
    var msgEl = document.getElementById('msg');
    var btn = document.getElementById('btnSubmit');

    if (!token) {
      formState.classList.add('state-hidden');
      noTokenState.classList.remove('state-hidden');
    } else {
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();

        var novaSenha = document.getElementById('novaSenha').value;
        var confirmarSenha = document.getElementById('confirmarSenha').value;

        showMsg('', null);

        if (novaSenha.length < 6) {
          showMsg('A senha precisa ter no mínimo 6 caracteres.', 'error');
          return;
        }
        if (novaSenha !== confirmarSenha) {
          showMsg('As senhas não coincidem.', 'error');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Redefinindo...';

        fetch('/api/auth/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, novaSenha: novaSenha })
        })
          .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (body) {
              return { ok: res.ok, body: body };
            });
          })
          .then(function (result) {
            if (result.ok) {
              form.classList.add('state-hidden');
              showMsg('Senha redefinida com sucesso! Você já pode voltar ao app SafraPay e fazer login com a nova senha.', 'success');
            } else {
              var texto = (result.body && (result.body.message || result.body.mensagem))
                || 'Não foi possível redefinir a senha. O link pode ter expirado ou já ter sido usado — solicite um novo pelo app.';
              showMsg(texto, 'error');
              btn.disabled = false;
              btn.textContent = 'Redefinir senha';
            }
          })
          .catch(function () {
            showMsg('Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.', 'error');
            btn.disabled = false;
            btn.textContent = 'Redefinir senha';
          });
      });
    }

    function showMsg(texto, tipo) {
      if (!texto) {
        msgEl.className = 'msg';
        msgEl.textContent = '';
        return;
      }
      msgEl.textContent = texto;
      msgEl.className = 'msg show ' + tipo;
    }
  </script>
</body>
</html>
